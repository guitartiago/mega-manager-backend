## ---- CACHE ---- ##
# Tipo de cache (simple, redis, etc)
spring.cache.type=simple

# Tempo de expiração do cache em segundos (opcional)
# spring.cache.cache-names=produtos,clientes,usuarios

## ---- AUDITORIA ---- ##
# Ativar auditoria JPA (já ativado em JpaAuditingConfig.java)
spring.jpa.hibernate.use-new-id-generator-mappings=true

## ---- PAGINAÇÃO ---- ##
# Tamanho padrão de página
app.pagination.default-size=20
app.pagination.max-size=100

## ---- SEGURANÇA ---- ##
# CORS - Já configurado em SecurityConfig.java
# Adicione origens via variáveis de ambiente se necessário
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000}

## ---- HIBERNATE ---- ##
# Mostrar SQL em logs (apenas desenvolvimento)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=true

## ---- VALIDAÇÃO ---- ##
# Lançar exceção se alguma propriedade desconhecida
spring.jpa.properties.hibernate.globally_quoted_identifiers=false
